name: daily-signal

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Commit chart
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add output/chart.png
          git commit -m "update chart" || echo "No changes"
          git push
